<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f6f62"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>My Reading & Growth Journal</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#222;--mu:#6b6b66;--ac:#2f6f62;--bd:#e3e1db;--ac2:#e4f0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171917;--card:#222522;--tx:#ecece8;--mu:#9a9a94;--ac:#6cc3b0;--bd:#343834;--ac2:#25332f}}
:root[data-theme=dark]{--bg:#171917;--card:#222522;--tx:#ecece8;--mu:#9a9a94;--ac:#6cc3b0;--bd:#343834;--ac2:#25332f}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;flex-direction:column;min-height:100vh}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd)}
nav b{display:none}nav button{white-space:nowrap;text-align:left}
main{flex:1;padding:16px;max-width:1000px;width:100%;margin:0 auto}
@media(min-width:800px){#app{flex-direction:row}nav{flex-direction:column;width:210px;overflow:visible;border-right:1px solid var(--bd);border-bottom:0;padding:16px 10px}nav b{display:block;padding:4px 10px 12px}}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p,nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:#b3372f}nav button{border:0;background:none}nav button.on{color:#fff}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin:2px 0 8px}
label{font-size:13px;color:var(--mu)}h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.st{font-size:24px;font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{width:auto}.row>.f{flex:1;min-width:120px}
.cv{height:90px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;margin-bottom:8px}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:2px;height:100px}.bars div{flex:1;background:var(--ac);min-height:2px;border-radius:2px 2px 0 0}
.tag{background:var(--ac2);border-radius:20px;padding:1px 8px;font-size:12px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:440px;width:92%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<script>
const K='rgj1',$=s=>document.querySelector(s);let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{books:[],sessions:[],notes:[],goals:[],profile:{},yg:12,timer:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save: storage is full or blocked')}};
const uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0),num=v=>Math.max(0,parseInt(v)||0);
const ST={want:'Want to Read',reading:'Currently Reading',paused:'Paused',done:'Completed',dropped:'Abandoned'};
const NAV=[['dash','Dashboard'],['lib','My Library'],['reading','Currently Reading'],['want','Want to Read'],['done','Completed'],['notes','Notebook'],['goals','Goals'],['profile','My Profile'],['stats','Stats & Export'],['settings','Settings']];
let V='dash',Q={q:'',st:'',sort:'added'},NID=null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2500)}
function cfm(m,fn,no){const d=$('#dlg2');d.innerHTML=`<p>${esc(m)}</p><div class=row><button class=p id=cy>Confirm</button><button id=cn>Cancel</button></div>`;d.showModal();$('#cy').onclick=()=>{d.close();fn()};$('#cn').onclick=()=>{d.close();if(no)no()}}
const book=id=>S.books.find(b=>b.id==id),pct=b=>b.pages?Math.min(100,Math.round(b.cur/b.pages*100)):null;
const hue=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
function streak(){const d=new Set(S.sessions.map(s=>s.date));let n=0,x=new Date();if(!d.has(ld(x)))x.setDate(x.getDate()-1);while(d.has(ld(x))){n++;x.setDate(x.getDate()-1)}return n}
function days(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ld(d),ss=S.sessions.filter(s=>s.date==k);o.push({l:k.slice(5),p:sum(ss,'pages'),m:sum(ss,'mins')})}return o}
const bars=(a,k)=>{const mx=Math.max(1,...a.map(x=>x[k]));return'<div class=bars>'+a.map(x=>`<div title="${x.l}: ${x[k]}" style="height:${x[k]/mx*100}%"></div>`).join('')+'</div>'};
const pb=p=>`<div class=pb><i style="width:${p||0}%"></i></div>`;
function genres(){const m={};S.books.forEach(b=>{const g=b.genre||'Uncategorized';m[g]=(m[g]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const genreHtml=()=>{const g=genres(),mx=g.length?g[0][1]:1;return g.length?g.map(([n,c])=>`<div class=mu>${esc(n)} (${c})</div>${pb(c/mx*100)}`).join(''):'<p class=mu>No books yet.</p>'};
function go(v){V=v;NID=null;render()}
function render(){$('#nav').innerHTML='<b>📚 Reading Journal</b>'+NAV.map(([k,l])=>`<button class="${k==V?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#main').innerHTML=(VW[V]||VW.lib)();if(VI[V])VI[V]()}
/* ---------- books ---------- */
function card(b){const p=pct(b);return`<div class=card style="margin:0"><div class=cv style="background:hsl(${hue(b.title)} 40% 38%)">${esc(b.title[0]||'?').toUpperCase()}</div><b>${esc(b.title)}</b><div class=mu>${esc(b.author||'Unknown author')}${b.rating?' · '+'★'.repeat(b.rating):''}</div>${p!==null?pb(p)+`<div class=mu>${p}% · p.${b.cur}/${b.pages}</div>`:`<div class=mu>${b.cur?'p.'+b.cur:'No page count'}</div>`}
<select onchange="setSt('${b.id}',this.value)">${Object.entries(ST).map(([k,l])=>`<option value=${k} ${k==b.status?'selected':''}>${l}</option>`).join('')}</select><div class=row><button onclick="bookForm('${b.id}')">Edit</button><button class=d onclick="delBook('${b.id}')">Delete</button></div></div>`}
function bookForm(id){const b=id?book(id):{status:'want',cur:0,pages:'',rating:0},f=(k,l,t='text')=>`<label>${l}</label><input id=f_${k} type=${t} value="${esc(b[k]??'')}">`;
$('#dlg').innerHTML=`<h2>${id?'Edit':'Add'} book</h2>${f('title','Title *')}${f('author','Author(s)')}${f('genre','Genre / category')}<div class=row><div class=f>${f('pages','Total pages','number')}</div><div class=f>${f('cur','Current page','number')}</div></div><label>Status</label><select id=f_status>${Object.entries(ST).map(([k,l])=>`<option value=${k} ${k==b.status?'selected':''}>${l}</option>`).join('')}</select><label>Rating (0–5)</label><input id=f_rating type=number min=0 max=5 value="${b.rating||0}"><label>Notes</label><textarea id=f_notes rows=3>${esc(b.notes||'')}</textarea><p id=err class=mu style="color:#b3372f"></p><div class=row><button class=p onclick="saveBook('${id||''}')">Save</button><button onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal()}
function saveBook(id){const g=k=>$('#f_'+k).value.trim(),t=g('title'),pages=num(g('pages')),cur=num(g('cur')),st=g('status'),r=num(g('rating'));
const e=!t?'Title is required.':pages&&cur>pages?'Current page cannot exceed total pages.':r>5?'Rating must be 0–5.':'';if(e){$('#err').textContent=e;return}
const fin=()=>{
let b=id?book(id):{id:uid(),added:ld(),started:'',done:''};Object.assign(b,{title:t,author:g('author'),genre:g('genre'),pages,cur,rating:r,notes:g('notes')});if(!id)S.books.push(b);applySt(b,st);save();$('#dlg').close();render()};if(st=='done'&&!(id&&book(id).status=='done'))cfm('Mark this book as completed?',fin);else fin()}
function applySt(b,st){b.status=st;if(st=='reading'&&!b.started)b.started=ld();if(st=='done'){b.done=b.done||ld();if(b.pages)b.cur=b.pages}else if(b.done&&st!='done')b.done=''}
function setSt(id,st){const b=book(id),f=()=>{applySt(b,st);save();render()};if(st=='done')cfm('Mark "'+b.title+'" as completed?',f,render);else f()}
function delBook(id){cfm('Delete this book? Its reading sessions will also be removed.',()=>{S.books=S.books.filter(b=>b.id!=id);S.sessions=S.sessions.filter(s=>s.bid!=id);S.notes.forEach(n=>{if(n.bid==id)n.bid=''});save();render()})}
function gridHtml(fixed){let a=S.books.filter(b=>(fixed||Q.st)?b.status==(fixed||Q.st):true);const q=Q.q.toLowerCase();if(q)a=a.filter(b=>(b.title+' '+b.author+' '+b.genre).toLowerCase().includes(q));
const so={title:(x,y)=>x.title.localeCompare(y.title),author:(x,y)=>(x.author||'').localeCompare(y.author||''),added:(x,y)=>y.added.localeCompare(x.added),progress:(x,y)=>(pct(y)||0)-(pct(x)||0),rating:(x,y)=>y.rating-x.rating};a.sort(so[Q.sort]);
return a.length?`<div class=g>${a.map(card).join('')}</div>`:'<div class=card><p>No books here yet.</p><button class=p onclick="bookForm()">Add a book</button></div>'}
const upd=fixed=>{$('#grid').innerHTML=gridHtml(fixed)};
function libView(fixed,title){return`<h1>${title}</h1><div class=row><input class=f placeholder="Search title, author, genre" value="${esc(Q.q)}" oninput="Q.q=this.value;upd('${fixed||''}')">${fixed?'':`<select onchange="Q.st=this.value;upd()"><option value="">All statuses</option>${Object.entries(ST).map(([k,l])=>`<option value=${k} ${Q.st==k?'selected':''}>${l}</option>`).join('')}</select>`}<select onchange="Q.sort=this.value;upd('${fixed||''}')">${['added','title','author','progress','rating'].map(s=>`<option ${Q.sort==s?'selected':''}>${s}</option>`).join('')}</select><button class=p onclick="bookForm()">+ Add book</button></div><br><div id=grid>${gridHtml(fixed)}</div>`}
/* ---------- sessions & timer ---------- */
const el=()=>S.timer?S.timer.acc+(S.timer.start?Date.now()-S.timer.start:0):0,fmt=ms=>{const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
function tStart(){const id=$('#tb').value;if(!id)return toast('Add a book to Currently Reading first');S.timer={bid:id,acc:0,start:Date.now()};save();render()}
function tPause(){const t=S.timer;if(t.start){t.acc+=Date.now()-t.start;t.start=null}else t.start=Date.now();save();render()}
function tFinish(){const t=S.timer,m=Math.max(1,Math.round(el()/60000)),d=$('#dlg2');d.innerHTML=`<p>Pages read in this session?</p><input id=tp type=number min=0 value=0><div class=row><button class=p id=cy>Save</button><button id=cn>Cancel</button></div>`;d.showModal();$('#cy').onclick=()=>{const p=num($('#tp').value);d.close();S.timer=null;addSess(t.bid,p,m,'Timed session',ld());render()};$('#cn').onclick=()=>d.close()}
function addSess(bid,pages,mins,note,date){const b=book(bid);if(!b)return;if(b.pages&&b.cur+pages>b.pages)pages=Math.max(0,b.pages-b.cur);S.sessions.push({id:uid(),bid,pages,mins,note,date,at:Date.now()});b.cur+=pages;if(b.status=='want'||b.status=='paused'){b.status='reading';b.started=b.started||ld()}save();toast('Session saved')}
function logSess(){const bid=$('#lb').value,p=num($('#lp').value),m=num($('#lm').value),d=$('#ld').value||ld();if(!bid)return toast('Choose a book');if(!p&&!m)return toast('Enter pages or minutes');if(d>ld())return toast('Date cannot be in the future');addSess(bid,p,m,$('#ln').value,d);render()}
function setCur(id){const b=book(id),v=num($('#c_'+id).value);if(b.pages&&v>b.pages)return toast('Cannot exceed '+b.pages+' pages');b.cur=v;save();render()}
function delSess(id){const s=S.sessions.find(x=>x.id==id),b=book(s.bid);if(b)b.cur=Math.max(0,b.cur-s.pages);S.sessions=S.sessions.filter(x=>x.id!=id);save();render()}
function eta(b){const ss=S.sessions.filter(s=>s.bid==b.id&&s.pages>0);if(!b.pages||ss.length<2)return'';const d=new Set(ss.map(s=>s.date)).size,rate=sum(ss,'pages')/Math.max(1,d),left=b.pages-b.cur;if(left<=0)return'';const x=new Date();x.setDate(x.getDate()+Math.ceil(left/rate));return' · est. finish '+ld(x)}
function readingView(){const rb=S.books.filter(b=>b.status=='reading'),opts=S.books.filter(b=>['reading','paused','want'].includes(b.status)).map(b=>`<option value=${b.id}>${esc(b.title)}</option>`).join(''),t=S.timer;
return`<h1>Currently Reading</h1><div class=card><h2>Reading timer</h2>${t?`<div class=st id=tv>${fmt(el())}</div><div class=mu>${esc((book(t.bid)||{}).title||'')}</div><div class=row><button onclick="tPause()">${t.start?'Pause':'Resume'}</button><button class=p onclick="tFinish()">Finish & save</button><button class=d onclick="S.timer=null;save();render()">Discard</button></div>`:`<div class=row><select id=tb class=f>${opts}</select><button class=p onclick="tStart()">Start</button></div>`}<p class=mu>Timer uses saved timestamps, so closing the tab does not lose your time.</p></div>
<div class=card><h2>Log a session manually</h2><div class=row><select id=lb class=f>${opts}</select><input id=lp class=f type=number min=0 placeholder="Pages"><input id=lm class=f type=number min=0 placeholder="Minutes"><input id=ld type=date value="${ld()}"></div><input id=ln placeholder="Session note (optional)"><button class=p onclick="logSess()">Save session</button></div>
${rb.map(b=>{const p=pct(b);return`<div class=card><b>${esc(b.title)}</b> <span class=mu>${esc(b.author)}</span>${p!==null?pb(p)+`<div class=mu>${p}%${eta(b)}</div>`:''}<div class=row><input id=c_${b.id} class=f type=number min=0 value=${b.cur}><button onclick="setCur('${b.id}')">Update page</button></div></div>`}).join('')||'<p class=mu>Nothing in progress. Move a book to Currently Reading from your library.</p>'}
<h2>Recent sessions</h2>${S.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at).slice(0,15).map(s=>`<div class=card><div class=row><b class=f>${esc((book(s.bid)||{title:'(deleted)'}).title)}</b><span class=mu>${s.date}</span><button class=d onclick="delSess('${s.id}')">✕</button></div><div class=mu>${s.pages} pages · ${s.mins} min ${esc(s.note)}</div></div>`).join('')||'<p class=mu>No sessions yet.</p>'}`}
/* ---------- dashboard ---------- */
function dashView(){const b=S.books,yr=new Date().getFullYear(),dn=b.filter(x=>x.status=='done'),y=dn.filter(x=>(x.done||'').startsWith(yr)).length,c=(n,l)=>`<div class=card style="margin:0"><div class=st>${n}</div><div class=mu>${l}</div></div>`,wk=days(7);
if(!b.length&&!S.notes.length)return`<h1>Welcome 👋</h1><div class=card><p>Your journal is empty. Start here:</p><div class=row><button class=p onclick="bookForm()">Add your first book</button><button onclick="go('goals')">Set a reading goal</button><button onclick="go('profile')">Complete your profile</button></div></div>`;
const h=Math.round(sum(S.sessions,'mins')/6)/10;
return`<h1>Hi${S.profile.name?', '+esc(S.profile.name.split(' ')[0]):''}</h1><div class=g>${c(b.length,'Books')}${c(b.filter(x=>x.status=='reading').length,'Reading')}${c(dn.length,'Completed')}${c(b.filter(x=>x.status=='want').length,'Want to read')}${c(sum(S.sessions,'pages'),'Pages read')}${c(h+' h','Reading time')}${c(streak()+' d','Current streak')}${c(sum(wk,'p'),'Pages this week')}</div><br>
<div class=g2><div class=card><h2>Annual goal</h2>${pb(Math.min(100,y/S.yg*100))}<p class=mu>${y} of <input type=number min=1 value=${S.yg} style="width:70px;display:inline;margin:0" onchange="S.yg=Math.max(1,num(this.value));save();render()"> books in ${yr}</p></div>
<div class=card><h2>Pages, last 14 days</h2>${bars(days(14),'p')}</div><div class=card><h2>Categories</h2>${genreHtml()}</div>
<div class=card><h2>Recent notes</h2>${S.notes.slice().sort((a,b)=>b.upd-a.upd).slice(0,4).map(n=>`<div><a href=# onclick="NID='${n.id}';V='notes';render();return false">${esc(n.title||'Untitled')}</a></div>`).join('')||'<p class=mu>No notes yet.</p>'}</div></div>
<div class=card><h2>Next actions</h2>${!S.sessions.length?'<p>Log your first reading session.</p>':streak()?'<p>Nice rhythm — keep your streak going today.</p>':'<p>No session today yet. Even 10 minutes counts.</p>'}${b.some(x=>x.status=='want')&&!b.some(x=>x.status=='reading')?'<p>Pick a book from Want to Read and start it.</p>':''}</div>`}
/* ---------- notes ---------- */
let sv;function noteView(){if(NID){const n=S.notes.find(x=>x.id==NID);return`<h1>Note</h1><div class=card><input id=nt placeholder="Title" value="${esc(n.title)}" oninput="ns()"><div class=row><select id=ny onchange="ns()">${['General','Book summary','Chapter summary','Concept','Definition','Formula','Research','Lesson learned','Question','Idea','Action item'].map(t=>`<option ${n.type==t?'selected':''}>${t}</option>`).join('')}</select><select id=nb onchange="ns()"><option value="">No linked book</option>${S.books.map(b=>`<option value=${b.id} ${n.bid==b.id?'selected':''}>${esc(b.title)}</option>`).join('')}</select><label><input type=checkbox id=nf style="width:auto" ${n.fav?'checked':''} onchange="ns()"> ★ Favorite</label></div><input id=ng placeholder="Tags, comma separated" value="${esc(n.tags)}" oninput="ns()"><textarea id=nc rows=14 oninput="ns()" placeholder="Write here…">${esc(n.body)}</textarea><div class=row><span id=ss class=mu>Saved</span><button onclick="NID=null;render()">Back to notes</button><button class=d onclick="delNote()">Delete</button></div></div>`}
return`<h1>Study Notebook</h1><div class=row><input class=f placeholder="Search notes" oninput="Q.nq=this.value;nl()" value="${esc(Q.nq||'')}"><button class=p onclick="newNote()">+ New note</button></div><br><div id=nlist>${nlHtml()}</div>`}
function nlHtml(){const q=(Q.nq||'').toLowerCase(),a=S.notes.filter(n=>(n.title+n.body+n.tags).toLowerCase().includes(q)).sort((a,b)=>(b.fav-a.fav)||b.upd-a.upd);return a.map(n=>`<div class=card onclick="NID='${n.id}';render()" style="cursor:pointer"><b>${n.fav?'★ ':''}${esc(n.title||'Untitled')}</b> <span class=tag>${n.type}</span><div class=mu>${esc(n.body.slice(0,110))}</div><div class=mu>${n.bid&&book(n.bid)?'📖 '+esc(book(n.bid).title)+' · ':''}${new Date(n.upd).toLocaleDateString()}</div></div>`).join('')||'<div class=card><p class=mu>No notes found.</p></div>'}
const nl=()=>$('#nlist').innerHTML=nlHtml();
function newNote(){const n={id:uid(),title:'',body:'',type:'General',bid:'',tags:'',fav:false,upd:Date.now()};S.notes.push(n);save();NID=n.id;render()}
function ns(){$('#ss').textContent='Saving…';clearTimeout(sv);sv=setTimeout(nsave,500)}
function nsave(){const n=S.notes.find(x=>x.id==NID);if(!n)return;Object.assign(n,{title:$('#nt').value,body:$('#nc').value,type:$('#ny').value,bid:$('#nb').value,tags:$('#ng').value,fav:$('#nf').checked,upd:Date.now()});save();const s=$('#ss');if(s)s.textContent='Saved '+new Date().toLocaleTimeString()}
function delNote(){cfm('Delete this note?',()=>{S.notes=S.notes.filter(n=>n.id!=NID);NID=null;save();render()})}
addEventListener('beforeunload',()=>{if(NID&&$('#nt'))nsave()});
/* ---------- goals ---------- */
function range(p){const a=new Date(),b=new Date();if(p=='week')a.setDate(a.getDate()-((a.getDay()+6)%7));else if(p=='month')a.setDate(1);else if(p=='year'){a.setMonth(0);a.setDate(1)}return[ld(a),ld(b)]}
function gprog(g){const[a,b]=range(g.period),ss=S.sessions.filter(s=>s.date>=a&&s.date<=b);return g.unit=='books'?S.books.filter(x=>x.status=='done'&&x.done>=a&&x.done<=b).length:sum(ss,g.unit=='pages'?'pages':'mins')}
function addGoal(){const t=$('#gt').value.trim(),v=num($('#gv').value);if(!t||!v)return toast('Give the goal a title and target');S.goals.push({id:uid(),title:t,target:v,unit:$('#gu').value,period:$('#gp').value});save();render()}
const goalsView=()=>`<h1>Goals</h1><div class=card><div class=row><input id=gt class=f placeholder="e.g. Read 15 pages daily"><input id=gv type=number min=1 placeholder="Target" style="width:90px"><select id=gu><option>pages</option><option value=mins>minutes</option><option>books</option></select><select id=gp><option value=day>per day</option><option value=week>per week</option><option value=month>per month</option><option value=year>per year</option></select><button class=p onclick="addGoal()">Add</button></div></div>${S.goals.map(g=>{const p=gprog(g);return`<div class=card><div class=row><b class=f>${esc(g.title)}</b><button class=d onclick="S.goals=S.goals.filter(x=>x.id!='${g.id}');save();render()">✕</button></div>${pb(Math.min(100,p/g.target*100))}<div class=mu>${p} / ${g.target} ${g.unit} ${g.period=='day'?'today':'this '+g.period} ${p>=g.target?'· ✅ Achieved':'· Keep going, every bit counts'}</div></div>`}).join('')||'<p class=mu>No goals yet.</p>'}`;
/* ---------- profile ---------- */
const PF=[['name','Full name'],['title','Professional title'],['loc','Location'],['web','Website'],['bio','Short biography','t'],['about','Who I am / what I do','t'],['interests','Interests'],['skills','Skills (comma separated)'],['mission','Mission & vision','t'],['goals','Personal & career goals','t']];
function profView(){const p=S.profile;return`<h1>My Profile</h1><div class=g2><div class=card>${PF.map(([k,l,t])=>`<label>${l}</label>${t?`<textarea id=p_${k} rows=3>${esc(p[k])}</textarea>`:`<input id=p_${k} value="${esc(p[k])}">`}`).join('')}<button class=p onclick="PF.forEach(([k])=>S.profile[k]=$('#p_'+k).value.trim());save();render();toast('Profile saved')">Save profile</button></div><div class=card><h2>Preview</h2><div class=cv style="background:hsl(${hue(p.name||'x')} 40% 38%)">${esc((p.name||'?')[0]).toUpperCase()}</div><h2>${esc(p.name||'Your name')}</h2><div class=mu>${esc(p.title)} ${p.loc?'· '+esc(p.loc):''}</div><p>${esc(p.bio)}</p><p>${esc(p.about)}</p>${(p.skills||'').split(',').filter(s=>s.trim()).map(s=>`<span class=tag>${esc(s.trim())}</span> `).join('')}${p.mission?`<p><b>Mission:</b> ${esc(p.mission)}</p>`:''}<p class=mu>${S.books.filter(b=>b.status=='done').length} books completed. Your profile stays private on this device.</p></div></div>`}
/* ---------- stats / export ---------- */
function statsView(){const n=+(Q.rg||30),a=days(n),m={};S.books.filter(b=>b.status=='done'&&b.done).forEach(b=>{const k=b.done.slice(0,7);m[k]=(m[k]||0)+1});const ms=Object.entries(m).sort().map(([l,v])=>({l,v}));
return`<h1>Stats & Export</h1><select onchange="Q.rg=this.value;render()" style="width:auto">${[7,30,90,365].map(d=>`<option value=${d} ${n==d?'selected':''}>Last ${d} days</option>`).join('')}</select><br><br><div class=g2><div class=card><h2>Pages per day (${sum(a,'p')} total)</h2>${bars(a.slice(-60),'p')}</div><div class=card><h2>Minutes per day (${sum(a,'m')} total)</h2>${bars(a.slice(-60),'m')}</div><div class=card><h2>Books completed by month</h2>${ms.length?bars(ms,'v'):'<p class=mu>None yet.</p>'}</div><div class=card><h2>Categories</h2>${genreHtml()}</div></div><p class=mu>These figures show reading activity, not comprehension.</p>
<div class=card><h2>Export</h2><div class=row><button onclick="csv('books')">Books CSV</button><button onclick="csv('sessions')">Sessions CSV</button><button onclick="dl('rgj-backup.json',JSON.stringify(S,null,2),'application/json')">Full JSON</button><button onclick="window.print()">Print report</button></div></div>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function csv(w){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=w=='books'?[['title','author','genre','status','pages','current','rating','added','started','completed'],...S.books.map(b=>[b.title,b.author,b.genre,b.status,b.pages,b.cur,b.rating,b.added,b.started,b.done])]:[['date','book','pages','minutes','note'],...S.sessions.map(s=>[s.date,(book(s.bid)||{}).title,s.pages,s.mins,s.note])];dl(w+'.csv',r.map(x=>x.map(q).join(',')).join('\n'),'text/csv')}
function settingsView(){return`<h1>Settings</h1><div class=card><h2>Theme</h2><div class=row><button onclick="document.documentElement.dataset.theme='light'">Light</button><button onclick="document.documentElement.dataset.theme='dark'">Dark</button></div></div><div class=card><h2>Import backup</h2><input type=file accept=.json onchange="imp(this.files[0])"></div><div class=card><h2>Delete all data</h2><p class=mu>Data is stored only in this browser. Export a backup first.</p><button class=d onclick="cfm('Permanently delete everything?',()=>{localStorage.removeItem(K);location.reload()})">Delete everything</button></div>`}
function imp(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.books))throw 0;cfm('Replace current data with this backup?',()=>{S=Object.assign({books:[],sessions:[],notes:[],goals:[],profile:{},yg:12,timer:null},d);save();render()})}catch(e){toast('Not a valid backup file')}})}
const VW={dash:dashView,lib:()=>libView('','My Library'),reading:readingView,want:()=>libView('want','Want to Read'),done:()=>libView('done','Completed Books'),notes:noteView,goals:goalsView,profile:profView,stats:statsView,settings:settingsView};
const VI={};setInterval(()=>{const t=$('#tv');if(t&&S.timer)t.textContent=fmt(el())},1000);render();
</script></body></html>
