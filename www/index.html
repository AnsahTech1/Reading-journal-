function plansView(){S.plans=S.plans||[];return`<h1>Reading Plans</h1><p class=mu>Plan what to read this term and see how many pages to read on each study day.</p><button class=p onclick="planForm()">+ New plan</button><br><br>${S.plans.map(p=>{const s=pstats(p),nd=(p.days&&p.days.length?p.days:[0,1,2,3,4,5,6]).length;return`<div class=card><div class=row><b class=f style="font-size:16px">${esc(p.title)}</b>${p.subject?`<span class=tag>${esc(p.subject)}</span>`:''}</div><div class=mu>${p.start} to ${p.end} · ${nd} study days a week</div><div style="margin-top:8px">${pb(s.pct)}</div><div class="row sg" style="margin:10px 0"><div class=f><div class=st>${s.pct}%</div><div class=mu>${s.rd} of ${s.tot} pages</div></div><div class=f><div class=st>${s.per}</div><div class=mu>pages per study day</div></div><div class=f><div class=st>${s.rem}</div><div class=mu>study days left</div></div></div><div class=mu>${s.late?'Past the end date. Extend the plan or keep reading at your own pace.':s.tot?(s.ahead?'On track. Nice work.':'A little behind. About '+(s.exp-s.rd)+' pages to catch up, or move the end date.')+' Today: '+s.today+' pages read.':'Add books to see your daily target.'}</div>${s.bs.map(b=>`<div class=row style="margin-top:8px"><span class=f>${esc(b.title)}</span><span class=mu>${pct(b)===null?'no page count':pct(b)+'%'}</span><button onclick="planRm('${p.id}','${b.id}')" aria-label="Remove from plan">✕</button></div>`).join('')}<div class=row style="margin-top:10px"><select id=pa_${p.id} class=f><option value="">Add a book…</option>${S.books.filter(b=>!p.bids.includes(b.id)).map(b=>`<option value=${b.id}>${esc(b.title)}</option>`).join('')}</select><button onclick="planAdd('${p.id}')">Add</button></div><div class=row style="margin-top:10px"><button onclick="planForm('${p.id}')">Edit</button><button class=d onclick="planDel('${p.id}')">Delete</button></div></div>`}).join('')||'<div class=card style="text-align:center;padding:32px"><div class=ic-big>'+ic('plans')+'</div><p class=mu>No plans yet. Create one for a course, term or exam.</p></div>'}`}
function planForm(id){const p=id?S.plans.find(x=>x.id==id):{title:'',subject:'',start:ld(),end:'',days:[1,2,3,4,5]},DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];$('#dlg').innerHTML=`<h2>${id?'Edit':'New'} reading plan</h2><label>Plan name *</label><input id=pt value="${esc(p.title)}" placeholder="Semester 1 reading"><label>Subject or course</label><input id=ps value="${esc(p.subject)}"><div class=row><div class=f><label>Start *</label><input id=p1 type=date value="${p.start}"></div><div class=f><label>End *</label><input id=p2 type=date value="${p.end}"></div></div><label>Study days</label><div class=row id=pd>${DN.map((d,i)=>`<label style="display:flex;align-items:center;gap:4px;width:auto"><input type=checkbox value=${i} ${(p.days||[]).includes(i)?'checked':''} style="width:auto;margin:0">${d}</label>`).join('')}</div><p id=perr class=mu style="color:#b3372f"></p><div class=row><button class=p onclick="planSave('${id||''}')">Save</button><button onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal()}
function planSave(id){const t=$('#pt').value.trim(),a=$('#p1').value,b=$('#p2').value,days=[...document.querySelectorAll('#pd input:checked')].map(x=>+x.value),e=!t?'Give the plan a name.':!a||!b?'Choose a start and end date.':b<a?'The end date must be after the start date.':'';if(e){$('#perr').textContent=e;return}const p=id?S.plans.find(x=>x.id==id):{id:uid(),bids:[]};Object.assign(p,{title:t,subject:$('#ps').value.trim(),start:a,end:b,days});if(!id)S.plans.push(p);save();$('#dlg').close();render()}
function planAdd(id){const v=$('#pa_'+id).value;if(!v)return;S.plans.find(x=>x.id==id).bids.push(v);save();render()}
function planRm(id,b){const p=S.plans.find(x=>x.id==id);p.bids=p.bids.filter(x=>x!=b);save();render()}
function planDel(id){cfm('Move this plan to Trash? You can restore it for 30 days.',()=>{const p=S.plans.find(x=>x.id==id);if(p)toTrash('plan',p);S.plans=S.plans.filter(x=>x.id!=id);save();render();toast('Moved to Trash')})}
/* ---------- study topics, free library, export ---------- */
S.topics=S.topics||[];let FL={q:'',busy:0,gb:null,ol:null,err:''};const LV=['Just started','Getting there','Confident'];
function subjectList(){const m=new Set();(S.topics||[]).forEach(t=>t.subject&&m.add(t.subject));S.notes.forEach(n=>n.subject&&m.add(n.subject));(S.plans||[]).forEach(p=>p.subject&&m.add(p.subject));return[...m].sort()}
function subjRows(){const a={};(S.topics||[]).forEach(t=>{const o=a[t.subject]||(a[t.subject]={n:0,m:0});o.n++;o.m+=t.mins||0});S.notes.forEach(n=>{if(n.subject&&!a[n.subject])a[n.subject]={n:0,m:0}});return Object.entries(a).filter(([k,o])=>o.n>0).sort((x,y)=>y[1].n-x[1].n)}
function addTopic(){const s=$('#ts').value.trim(),t=$('#tt2').value.trim(),m=num($('#tm').value),d=$('#td').value||ld();if(!s||!t)return toast('Enter a subject and a topic');if(d>ld())return toast('The date cannot be in the future');S.topics.push({id:uid(),date:d,subject:s,title:t,mins:m,note:$('#tn').value.trim(),lvl:+$('#tl').value});save();toast('Topic saved');render()}
function delTopic(id){const t=S.topics.find(x=>x.id==id);if(t)toTrash('topic',t);S.topics=S.topics.filter(x=>x.id!=id);save();render();toast('Moved to Trash')}
function topicNote(id){const t=S.topics.find(x=>x.id==id),n={id:uid(),title:t.title,body:t.note||'',type:'Class notes',bid:'',tags:'',fav:false,upd:Date.now(),subject:t.subject,topic:t.title};S.notes.push(n);save();NID=n.id;V='notes';render()}
function studyView(){S.topics=S.topics||[];const sf=Q.sf||'',subs=subjectList(),list=S.topics.filter(t=>!sf||t.subject==sf).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60),rows=subjRows();
return`<h1>Study Topics</h1><p class=mu>Write down what you study in class or on your own, subject by subject.</p><div class=card><h2>What did you study?</h2><label>Subject or class *</label><input id=ts list=subs placeholder="Biology" autocomplete=off><datalist id=subs>${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><label>Topic *</label><input id=tt2 placeholder="Cell structure and organelles"><div class=row><div class=f><label>Date</label><input id=td type=date value="${ld()}"></div><div class=f><label>Minutes</label><input id=tm type=number min=0 placeholder="45"></div></div><label>How well do you understand it?</label><select id=tl>${LV.map((l,i)=>`<option value=${i}>${l}</option>`).join('')}</select><label>Notes (optional)</label><textarea id=tn rows=3 placeholder="Key points, questions, homework"></textarea><button class=p onclick="addTopic()">Save to study log</button></div>${rows.length?`<div class=card><h2>Subjects you study most</h2>${rows.slice(0,6).map(([s,o])=>`<div class=row><span class=f>${esc(s)}</span><span class=mu>${o.n} topic${o.n==1?'':'s'}${o.m?' · '+o.m+' min':''}</span></div>${pb(o.n/rows[0][1].n*100)}`).join('')}</div>`:''}${subs.length?`<div class=row style="margin-bottom:10px"><select class=f onchange="Q.sf=this.value;render()"><option value="">All subjects</option>${subs.map(s=>`<option ${sf==s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`:''}${list.map(t=>`<div class=card><div class=row><b class=f>${esc(t.title)}</b><span class=tag>${esc(t.subject)}</span></div><div class=mu>${t.date}${t.mins?' · '+t.mins+' min':''} · ${LV[t.lvl]||LV[0]}</div>${t.note?`<p style="margin:8px 0">${esc(t.note)}</p>`:''}<div class=row style="margin-top:8px"><button onclick="topicNote('${t.id}')">Turn into a note</button><button class=d onclick="delTopic('${t.id}')">Delete</button></div></div>`).join('')||'<p class=mu>No topics logged yet.</p>'}`}
function addWant(o){if(S.books.some(b=>b.title.toLowerCase()==String(o.title).toLowerCase()))return toast('Already in your library');S.books.push({id:uid(),title:o.title,author:o.author||'',genre:o.genre||'',pages:num(o.pages),cur:0,status:'want',rating:0,notes:'',about:o.about||'',isbn:o.isbn||'',publisher:o.publisher||'',year:String(o.year||''),added:ld(),started:'',done:''});save();toast('Added to Want to Read');render()}
const gtxt=b=>{const f=b.formats||{};return f['text/plain; charset=utf-8']||f['text/plain; charset=us-ascii']||f['text/plain']||''};
async function flSearch(){const q=($('#flq').value||'').trim();if(!q)return toast('Type a title, author or subject');FL={q,busy:1,gb:null,ol:null,err:''};render();try{const[g,o]=await Promise.allSettled([fetch('https://gutendex.com/books/?search='+encodeURIComponent(q)).then(r=>r.json()),fetch('https://openlibrary.org/search.json?limit=10&fields=key,title,author_name,first_publish_year,number_of_pages_median,isbn,ia,ebook_access&q='+encodeURIComponent(q)).then(r=>r.json())]);FL.gb=g.status=='fulfilled'?(g.value.results||[]).slice(0,10):null;FL.ol=o.status=='fulfilled'?(o.value.docs||[]):null;if(!FL.gb&&!FL.ol)FL.err='Search needs internet access in the Android app.'}catch(e){FL.err='Search failed. Check your connection.'}FL.busy=0;render()}
function glAdd(i){const b=FL.gb[i];addWant({title:b.title,author:(b.authors||[]).map(a=>a.name).join(', '),genre:((b.subjects||[])[0]||'').split(' -- ')[0],about:'Free public-domain ebook from Project Gutenberg.',publisher:'Project Gutenberg'})}
function olAdd(i){const x=FL.ol[i];addWant({title:x.title,author:(x.author_name||[]).slice(0,2).join(', '),pages:x.number_of_pages_median,year:x.first_publish_year,isbn:(x.isbn||[])[0]})}
async function glDl(i){const b=FL.gb[i],u=gtxt(b);if(!u)return toast('No plain-text edition for this title');toast('Downloading…');try{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text(),blob=new Blob([t],{type:'text/plain'}),id=uid();await fput(id,blob);let bk=S.books.find(x=>x.title.toLowerCase()==b.title.toLowerCase());if(!bk){bk={id:uid(),title:b.title,author:(b.authors||[]).map(a=>a.name).join(', '),genre:((b.subjects||[])[0]||'').split(' -- ')[0],pages:Math.max(1,Math.round(t.length/2200)),cur:0,status:'want',rating:0,notes:'',about:'Free public-domain ebook from Project Gutenberg.',isbn:'',publisher:'Project Gutenberg',year:'',added:ld(),started:'',done:''};S.books.push(bk)}S.docs.push({id,title:b.title,ext:'txt',size:blob.size,added:ld(),bid:bk.id,page:1,pages:0,mins:0,name:b.title+'.txt'});save();toast('Saved to Documents. Open it there to read.');render()}catch(e){toast('Download failed. It works in the Android app with internet.')}}
function freelibView(){const g=FL.gb,o=FL.ol;return`<h1>Free Library</h1><p class=mu>Search free public-domain books (Project Gutenberg) and the Open Library catalogue. Free books can be saved to Documents and read here.</p><div class=row><input id=flq class=f placeholder="Title, author or subject" value="${esc(FL.q)}" onkeydown="if(event.key=='Enter')flSearch()"><button class=p onclick="flSearch()" ${FL.busy?'disabled':''}>${FL.busy?'Searching…':'Search'}</button></div><br>${FL.err?`<div class=card><p class=mu>${esc(FL.err)}</p></div>`:''}${g?`<h2>Free to read · Project Gutenberg</h2>${g.map((b,i)=>`<div class=card><b>${esc(b.title)}</b><div class=mu>${esc((b.authors||[]).map(a=>a.name).join(', ')||'Unknown author')} · ${esc((b.languages||[]).join(', '))} · ${b.download_count||0} downloads</div><div class=row style="margin-top:8px">${gtxt(b)?`<button class=p onclick="glDl(${i})">Download to read</button>`:'<span class=mu>No text edition</span>'}<button onclick="glAdd(${i})">+ Want to Read</button></div></div>`).join('')||'<p class=mu>No free books found.</p>'}`:''}${o?`<h2>Open Library catalogue</h2>${o.map((x,i)=>`<div class=card><b>${esc(x.title)}</b><div class=mu>${esc((x.author_name||[]).slice(0,2).join(', '))} ${x.first_publish_year?'· '+x.first_publish_year:''} ${x.number_of_pages_median?'· '+x.number_of_pages_median+' pages':''}</div>${x.ebook_access=='public'?'<span class=tag>Free to read online</span>':x.ebook_access=='borrowable'?'<span class=tag>Borrowable with a free account</span>':''}<div class=row style="margin-top:8px"><button class=p onclick="olAdd(${i})">+ Want to Read</button>${x.ia&&x.ia[0]?`<a href="https://archive.org/details/${encodeURIComponent(x.ia[0])}" target=_blank rel=noopener><button>Open on Internet Archive</button></a>`:''}</div></div>`).join('')||'<p class=mu>No results.</p>'}`:''}`}
function exportDlg(n,t,m){window.XO={n,t,m};$('#dlg').innerHTML=`<h2>Export ready</h2><p class=mu>${esc(n)} · ${fsz(new Blob([t]).size)}</p><textarea id=xt rows=8 readonly style="font:12px monospace"></textarea><div class=row><button class=p onclick="saveOut(XO.n,new Blob([XO.t],{type:XO.m}))">Save or share file</button><button onclick="copyOut()">Copy text</button><button onclick="$('#dlg').close()">Close</button></div><p class=mu>If saving does not start, tap Copy text and paste it into a note or message to yourself. A JSON backup can be pasted back in under Settings.</p>`;$('#xt').value=t.length>200000?t.slice(0,200000)+'\n…':t;$('#dlg').showModal()}
async function copyOut(){try{await navigator.clipboard.writeText(XO.t);toast('Copied to clipboard')}catch(e){const x=$('#xt');x.value=XO.t;x.removeAttribute('readonly');x.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e2){toast('Select the text and copy it manually')}}}
function csv(w){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',T={books:[['title','author','genre','status','pages','current','rating','isbn','publisher','year','added','started','completed'],...S.books.map(b=>[b.title,b.author,b.genre,b.status,b.pages,b.cur,b.rating,b.isbn,b.publisher,b.year,b.added,b.started,b.done])],sessions:[['date','book','pages','minutes','note'],...S.sessions.map(s=>[s.date,(book(s.bid)||{}).title,s.pages,s.mins,s.note])],notes:[['title','type','subject','topic','book','tags','updated','text'],...S.notes.map(n=>[n.title,n.type,n.subject,n.topic,(book(n.bid)||{}).title,n.tags,new Date(n.upd).toISOString().slice(0,10),n.body])],topics:[['date','subject','topic','minutes','understanding','notes'],...(S.topics||[]).map(t=>[t.date,t.subject,t.title,t.mins,LV[t.lvl],t.note])]};dl(w+'.csv',T[w].map(x=>x.map(q).join(',')).join('\n'),'text/csv')}
const VW={dash:dashView,lib:()=>libView('','My Library'),reading:readingView,want:()=>libView('want','Want to Read'),done:()=>libView('done','Completed Books'),notes:noteView,docs:docsView,goals:goalsView,profile:profView,stats:statsView,settings:settingsView,trash:trashView,recs:recsView,alarms:alarmsView,plans:plansView,study:studyView,freelib:freelibView};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&NID&&$('#nt'))nsave()});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
addEventListener('popstate',()=>{if(R)closeDoc(true)});
addEventListener('error',e=>toast('Error: '+(e.message||'unknown')));addEventListener('unhandledrejection',e=>toast('Error: '+((e.reason&&e.reason.message)||e.reason)));
setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});tick();
const VI={};setInterval(()=>{const t=$('#tv');if(t&&S.timer)t.textContent=fmt(el())},1000);render();
</script></body></html>
